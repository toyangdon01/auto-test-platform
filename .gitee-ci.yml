# ============================================
# Gitee Go 流水线配置文件
# 自动化测试管理平台
# ============================================
# 触发方式：手动触发
# ============================================

# 全局变量
variables:
  PROJECT_NAME: auto-test-platform
  VERSION: 1.0.0

# ============================================
# Stage 1: 准备环境
# ============================================
prepare:
  stage: prepare
  when: manual  # 手动触发
  script:
    - echo "=========================================="
    - echo "开始构建: $PROJECT_NAME v$VERSION"
    - echo "=========================================="
    - echo "检查 Java 版本"
    - java -version
    - echo "检查 Maven 版本"
    - mvn --version
    - echo "检查 Node.js 版本"
    - node --version
    - echo "=========================================="
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# ============================================
# Stage 2: 构建后端
# ============================================
build-backend:
  stage: build
  needs: prepare
  script:
    - echo "=========================================="
    - echo "构建后端..."
    - echo "=========================================="
    - cd backend
    - mvn clean package -DskipTests
    - cd ..
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 week

# ============================================
# Stage 3: 构建前端
# ============================================
build-frontend:
  stage: build
  needs: prepare
  script:
    - echo "=========================================="
    - echo "构建前端..."
    - echo "=========================================="
    - cd frontend
    - npm install
    - npm run build
    - cd ..
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# ============================================
# Stage 4: 打包 JAR（含前端资源）
# ============================================
package-jar:
  stage: package
  needs: [build-backend, build-frontend]
  script:
    - echo "=========================================="
    - echo "打包 JAR (含前端资源)..."
    - echo "=========================================="
    # 复制前端资源到后端 static 目录
    - mkdir -p backend/src/main/resources/static
    - cp -r frontend/dist/* backend/src/main/resources/static/
    # 重新打包 JAR
    - cd backend
    - mvn package -DskipTests
    - cd ..
    # 复制 JAR 到 dist 目录
    - mkdir -p dist
    - cp backend/target/auto-test-platform-1.0.0-SNAPSHOT.jar dist/$PROJECT_NAME-$VERSION.jar
    - echo "JAR 打包完成"
    - ls -lh dist/
  artifacts:
    paths:
      - dist/
    expire_in: 2 weeks

# ============================================
# Stage 5: 打包 Windows x86（含 JRE17）
# ============================================
package-windows:
  stage: package
  needs: package-jar
  script:
    - echo "=========================================="
    - echo "打包 Windows x86 版本..."
    - echo "=========================================="
    # 下载 JRE17 Windows x64
    - curl -L https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.9%2B9.1/OpenJDK17U-jre_x64_windows_hotspot.zip -o temp-windows/jre.zip
    # 解压 JRE
    - mkdir -p temp-windows/release
    - cd temp-windows
    - unzip -q jre.zip
    - cd ..
    # 整理 JRE 目录
    - JRE_DIR=$(ls temp-windows | grep -i jdk | grep -i jre | head -1)
    - if [ -n "$JRE_DIR" ]; then mv temp-windows/$JRE_DIR temp-windows/release/jre; fi
    # 复制 JAR 和启动脚本
    - mkdir -p dist/$PROJECT_NAME-windows-x64
    - cp dist/$PROJECT_NAME-$VERSION.jar dist/$PROJECT_NAME-windows-x64/$PROJECT_NAME.jar
    - cp -r temp-windows/release/jre dist/$PROJECT_NAME-windows-x64/
    # 创建 Windows 启动脚本
    - |
      @echo off
      cd /d "%~dp0"
      set "JAVA_HOME=%~dp0jre"
      set "PATH=%JAVA_HOME%\bin;%PATH%"
      java -jar %PROJECT_NAME%.jar
      pause
    > dist/$PROJECT_NAME-windows-x64/start.bat
    # 创建 README
    - |
      使用说明：
      1. 双击运行 start.bat
      2. 启动后访问 http://localhost:8080
      3. 配置文件位于 backend/src/main/resources/application.yml
    > dist/$PROJECT_NAME-windows-x64/README.txt
    # 打包成 zip
    - powershell Compress-Archive -Path dist/$PROJECT_NAME-windows-x64/* -DestinationPath dist/$PROJECT_NAME-windows-x64-$VERSION.zip -Force
    # 清理临时目录
    - rm -rf temp-windows
    - echo "Windows x86 打包完成"
  artifacts:
    paths:
      - dist/$PROJECT_NAME-windows-x64-$VERSION.zip
    expire_in: 2 weeks

# ============================================
# Stage 6: 打包 Linux ARM64（含 JRE17）
# ============================================
package-linux:
  stage: package
  needs: package-jar
  script:
    - echo "=========================================="
    - echo "打包 Linux ARM64 版本..."
    - echo "=========================================="
    # 安装必要工具
    - apt-get update && apt-get install -y curl unzip tar
    # 下载 JRE17 Linux ARM64
    - curl -L https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.9%2B9.1/OpenJDK17U-jre_aarch64_linux_hotspot.tar.gz -o temp-linux/jre.tar.gz
    # 创建发布目录
    - mkdir -p dist/$PROJECT_NAME-linux-arm64
    # 解压 JRE
    - mkdir -p temp-linux/release
    - tar -xzf temp-linux/jre.tar.gz -C temp-linux/release/
    # 整理 JRE 目录
    - JRE_DIR=$(ls temp-linux/release | grep -i jdk | grep -i jre | grep -i aarch64 | head -1)
    - if [ -n "$JRE_DIR" ]; then mv temp-linux/release/$JRE_DIR temp-linux/release/jre; else mv temp-linux/release/* temp-linux/release/jre 2>/dev/null || true; fi
    # 复制 JAR 和启动脚本
    - cp dist/$PROJECT_NAME-$VERSION.jar dist/$PROJECT_NAME-linux-arm64/$PROJECT_NAME.jar
    - cp -r temp-linux/release/jre dist/$PROJECT_NAME-linux-arm64/
    # 创建 Linux 启动脚本
    - |
      #!/bin/bash
      DIR="$(cd "$(dirname "$0")" && pwd)"
      export JAVA_HOME="$DIR/jre"
      export PATH="$JAVA_HOME/bin:$PATH"
      java -jar "$DIR/$PROJECT_NAME.jar"
    > dist/$PROJECT_NAME-linux-arm64/start.sh
    - chmod +x dist/$PROJECT_NAME-linux-arm64/start.sh
    # 创建 README
    - |
      使用说明：
      1. 运行 ./start.sh
      2. 启动后访问 http://localhost:8080
      3. 配置文件位于 backend/src/main/resources/application.yml
    > dist/$PROJECT_NAME-linux-arm64/README.txt
    # 打包成 tar.gz
    - cd dist
    - tar -czf $PROJECT_NAME-linux-arm64-$VERSION.tar.gz $PROJECT_NAME-linux-arm64
    - cd ..
    # 清理临时目录
    - rm -rf temp-linux
    - echo "Linux ARM64 打包完成"
  artifacts:
    paths:
      - dist/$PROJECT_NAME-linux-arm64-$VERSION.tar.gz
    expire_in: 2 weeks

# ============================================
# Stage 7: 发布构建产物
# ============================================
publish:
  stage: publish
  needs: [package-windows, package-linux]
  script:
    - echo "=========================================="
    - echo "构建完成！"
    - echo "=========================================="
    - echo "构建产物："
    - ls -lh dist/
    - echo ""
    - echo "产物信息："
    - echo "  - $PROJECT_NAME-$VERSION.jar"
    - echo "  - $PROJECT_NAME-windows-x64-$VERSION.zip"
    - echo "  - $PROJECT_NAME-linux-arm64-$VERSION.tar.gz"
    - echo "=========================================="
  when: always
