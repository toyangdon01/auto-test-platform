name: huawei-switch-config
scriptType: shell
testCategory: network
description: |
  华为交换机端口配置脚本
  将指定的 25GE 端口范围配置为 10GE 速率
  
parameters:
  - name: SWITCH_IP
    type: string
    default: ""
    description: 交换机 IP 地址
  - name: SWITCH_USER
    type: string
    default: "huawei123"
    description: 交换机 SSH 用户名
  - name: SWITCH_PASS
    type: string
    default: ""
    description: 交换机 SSH 密码
  - name: PORT_RANGE
    type: string
    default: "25ge 1/0/31 to 25ge 1/0/36"
    description: 要配置的端口范围，格式如 "25ge 1/0/31 to 25ge 1/0/36"
  - name: SPEED_MODE
    type: string
    default: "10000"
    description: 端口速率配置 (10000 = 10GE, 1000 = 1GE)

steps:
  configure_port:
    displayName: 配置交换机端口
    script: huawei-switch-config.py
    dependsOn: []
    resultParser: false
    params: []
    resources: []
    fileCollectEnabled: false