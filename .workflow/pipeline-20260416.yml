version: '1.0'
name: pipeline-20260416
displayName: pipeline-20260416
triggers:
  trigger: manual
  push:
    tags:
      prefix:
        - ''
stages:
  - name: stage-da9c0001
    displayName: build
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: build_nodejs
        displayName: Nodejs 构建
        nodeVersion: 18.16.0
        commands:
          - '# 设置NPM源，提升安装速度'
          - npm config set registry https://registry.npmmirror.com
          - ''
          - cd frontend
          - npm install
          - npm run build
          - mkdir -p ../backend/src/main/resources/static
          - cp -r dist/* ../backend/src/main/resources/static/
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./frontend/dist
        caches:
          - ~/.npm
          - ~/.yarn
        notify: []
        strategy:
          retry: '0'
      - step: build@maven
        name: build_maven
        displayName: Maven 构建
        jdkVersion: '17'
        mavenVersion: 3.3.9
        commands:
          - cd backend
          - mvn package -DskipTests
          - mkdir -p ../dist
          - cp target/*.jar ../dist/auto-test-platform-1.0.0.jar
          - '# 下载 JRE17 Linux ARM64'
          - mkdir -p temp-linux
          - curl -L https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.9%2B9.1/OpenJDK17U-jre_aarch64_linux_hotspot.tar.gz -o temp-linux/jre.tar.gz
          - ''
          - '# 创建发布目录'
          - mkdir -p dist/auto-test-platform-linux-arm64
          - ''
          - '# 解压 JRE'
          - tar -xzf temp-linux/jre.tar.gz -C dist/auto-test-platform-linux-arm64/
          - ''
          - '# 整理目录'
          - JRE_DIR=$(ls dist/auto-test-platform-linux-arm64 | grep -i jdk | grep -i jre | head -1)
          - if [ -n "$JRE_DIR" ]; then
          - '  mv dist/auto-test-platform-linux-arm64/$JRE_DIR dist/auto-test-platform-linux-arm64/jre'
          - fi
          - ''
          - '# 复制 JAR'
          - cp dist/auto-test-platform-1.0.0.jar dist/auto-test-platform-linux-arm64/auto-test-platform.jar
          - ''
          - '# 创建启动脚本'
          - cat > dist/auto-test-platform-linux-arm64/start.sh << 'EOF'
          - '#!/bin/bash'
          - DIR="$(cd "$(dirname "$0")" && pwd)"
          - export JAVA_HOME="$DIR/jre"
          - export PATH="$JAVA_HOME/bin:$PATH"
          - java -jar "$DIR/auto-test-platform.jar"
          - EOF
          - chmod +x dist/auto-test-platform-linux-arm64/start.sh
          - ''
          - '# 创建说明文件'
          - cat > dist/auto-test-platform-linux-arm64/README.txt << 'EOF'
          - 使用说明：
          - 1. 运行 ./start.sh
          - 2. 启动后访问 http://localhost:8080
          - EOF
          - ''
          - '# 打包成 tar.gz'
          - cd dist
          - tar -czf auto-test-platform-linux-arm64-1.0.0.tar.gz auto-test-platform-linux-arm64
          - cd ..
          - ''
          - '# 清理'
          - rm -rf temp-linux
        artifacts:
          - name: BUILD_ARTIFACT_JAR
            path:
              - ./dist/auto-test-platform-1.0.0.jar
              - ./dist/auto-test-platform-linux-arm64-1.0.0.tar.gz
        settings: []
        caches:
          - ~/.m2
        notify: []
        strategy:
          retry: '0'
        dependsOn: build_nodejs
  - name: stage-70ae0014
    displayName: release
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: publish@general_artifacts
        name: publish_general_artifacts
        displayName: 上传制品
        dependArtifact: BUILD_ARTIFACT_JAR
        artifactName: auto-test-platform
        notify: []
        strategy:
          retry: '0'
      - step: publish@release_artifacts
        name: publish_release_artifacts
        displayName: 发布
        dependArtifact: auto-test-platform
        version: 1.0.0.0
        autoIncrement: true
        notify: []
        strategy:
          retry: '0'
        dependsOn: publish_general_artifacts
