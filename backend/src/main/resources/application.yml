server:
  port: 8080

spring:
  application:
    name: auto-test-platform
  
  # 排除 Redis 自动配置（暂未安装）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  
  # 数据库初始化（首次启动时执行）
  sql:
    init:
      mode: always  # 首次部署时执行 schema.sql 和 data.sql
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
    
  # 数据源配置 - SQLite
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${user.home}/.autotest/test_platform.db?foreign_keys=on&journal_mode=WAL&busy_timeout=30000
    # SQLite 不需要用户名密码
    hikari:
      maximum-pool-size: 2  # SQLite 连接池，读可以并行，写需要独占
      minimum-idle: 1
      connection-timeout: 60000  # 获取连接超时 60 秒
      idle-timeout: 300000  # 空闲连接超时 5 分钟
      max-lifetime: 1800000  # 连接最大生命周期 30 分钟
      leak-detection-threshold: 60000  # 连接泄漏检测 60 秒
      connection-init-sql: PRAGMA foreign_keys = ON  # 每次连接时启用外键约束
  
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 20GB
      max-request-size: 20GB
  
  # Jackson JSON 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.autotest.entity
  type-handlers-package: com.autotest.handler
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'NULL'
    default-executor-type: reuse
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 平台自定义配置
autotest:
  # 存储路径配置（跨平台兼容）
  storage:
    scripts-path: ${user.home}/auto-test/scripts
    temp-path: ${user.home}/auto-test/temp
    results-path: ${user.home}/auto-test/results
    resources-path: ${user.home}/auto-test/resources
  
  # SSH 连接配置
  ssh:
    connect-timeout: 30000    # 连接超时 30 秒
    exec-timeout: 86400000    # 执行超时 24 小时
    default-port: 22
  
  # 任务执行配置
  task:
    max-parallel: 10
    default-timeout: 86400000  # 默认超时 24 小时（毫秒）
    log-keep-days: 30
    report-keep-days: 90
    metric-keep-days: 180
  
  # 任务状态检查配置（用于检测异常状态的任务）
  task-check:
    interval: 300000  # 检查间隔 5 分钟（毫秒），默认 5 分钟
  
  # 指标采集配置
  metric:
    default-interval: 5
    max-interval: 60

# 日志配置
logging:
  level:
    root: INFO
    com.autotest: DEBUG
    org.springframework.web: DEBUG
    org.springframework.scheduling: INFO
    org.mybatis: DEBUG
    org.apache.ibatis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/auto-test-platform.log
    max-size: 10MB
    max-history: 30

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI 文档配置
springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
